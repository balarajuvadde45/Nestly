# Nestly API on Render.
# Connect this GitHub repo, then set DATABASE_URL and JWT_SECRET in the dashboard.
# Do NOT run db:seed or db:reset on this service.

services:
  - type: web
    name: nestly-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push && npx tsx src/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_CITY
        value: Hyderabad
