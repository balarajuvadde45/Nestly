name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy values — CI never contacts a real database. `prisma generate`
      # needs DATABASE_URL to resolve the datasource block; the tests set their
      # own hermetic env (see backend/vitest.setup.ts).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      JWT_SECRET: ci_dummy_secret_not_used_for_real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # TODO (Phase 0.5 follow-up): add a Flutter job — `flutter analyze` + `flutter test`
  # + a web build — once we settle the Flutter toolchain version.
