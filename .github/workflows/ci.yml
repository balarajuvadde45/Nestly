name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nestly_test
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: nestly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nestly_test -d nestly_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://nestly_test:ci-only@localhost:5432/nestly_test
      TEST_DATABASE_URL: postgresql://nestly_test:ci-only@localhost:5432/nestly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # These non-routable URLs are compile checks, never deployment artifacts.
      - run: >-
          flutter build web --release
          --dart-define=API_BASE_URL=https://api.ci.invalid
          --dart-define=PUBLIC_WEB_URL=https://ci.invalid
          --dart-define=PRIVACY_URL=https://ci.invalid/privacy
          --dart-define=TERMS_URL=https://ci.invalid/terms
          --dart-define=SUPPORT_URL=https://ci.invalid/support
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      - run: >-
          flutter build ios --release --no-codesign
          --dart-define=API_BASE_URL=https://api.ci.invalid
          --dart-define=PUBLIC_WEB_URL=https://ci.invalid
          --dart-define=PRIVACY_URL=https://ci.invalid/privacy
          --dart-define=TERMS_URL=https://ci.invalid/terms
          --dart-define=SUPPORT_URL=https://ci.invalid/support
